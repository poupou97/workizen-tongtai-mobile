name: tongtai
description: "Tổng Tài — AI-First Business OS for SME entrepreneurs (Workizen)."
publish_to: 'none'
version: 0.1.0+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / DI (ADR-TON-002: Riverpod is the single DI framework)
  flutter_riverpod: ^3.3.2

  # `@immutable` cho code KHÔNG được import Flutter.
  #
  # Bình thường annotation này đến kèm `flutter/foundation`, nhưng seam Durable
  # Agent (WTM-301) có hợp đồng "không phụ thuộc vòng đời mobile" — nó phải
  # chạy được trên Managed Worker/Oracle VM. Nên nó khai `meta` tường minh
  # thay vì mượn qua Flutter.
  meta: ^1.19.0

  # Local-first storage (SQLite + Drift)
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Security (BYOK keys live only in secure storage)
  flutter_secure_storage: ^10.3.1
  # Passphrase-encrypted backups (WTM-100, Founder-approved dependency):
  # pure-Dart AES-GCM + PBKDF2 — no platform channels.
  cryptography: ^2.7.0

  # AI client (xAI Grok BYOK, WTM-61)
  http: ^1.6.0

  # Product features
  uuid: ^4.5.3
  image_picker: ^1.2.2
  flutter_markdown: ^0.7.7

  cupertino_icons: ^1.0.8
  share_plus: ^13.2.1

  # In-app mascot rendering — Origami Business Fox as runtime vector (WTM-111)
  flutter_svg: ^2.0.17
  mobile_scanner: ^7.4.0
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  crypto: ^3.0.7
  file_selector: ^1.1.0
  archive: ^4.0.9
  xml: ^7.0.1

dev_dependencies:
  # `package:test` thuần, KHÔNG qua flutter_test.
  #
  # Cần cho `agent_task_pure_dart_test.dart` — bằng chứng cho điều kiện D-4
  # (WTM-301): logic nhận việc chạy được khi KHÔNG có Flutter binding nào tồn
  # tại, nên nó chạy được trên Managed Worker/Oracle VM. Một test dùng
  # `flutter_test` tự dựng binding nên không chứng minh được điều đó.
  test: ^1.26.2

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

  # Brand assets — generate native launcher icon + splash from the Origami
  # Business Fox (WTM-110, ADR mascot = Business Fox / Origami). Dev-only:
  # run `dart run flutter_launcher_icons` and
  # `dart run flutter_native_splash:create` to regenerate.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/mascot/poses/
    # Bộ dữ liệu thương mại demo (WTM-325). Đóng gói vào app để Founder nhập
    # được ngay cả khi chưa nối Google Drive — cùng file, cùng đường import.
    - assets/demo/

# App launcher icon — WTM-366 (Epic WTM-362).
#
# Nguồn: docs/01-PRODUCT/concept-1/icon app.png (Founder cung cấp) — cáo mặc
# vest trên nền cam. Thay bộ Origami-trên-navy của WTM-110: hai hình cáo khác
# nhau giữa icon và trong app là cách người dùng không nhận ra cùng một sản
# phẩm, và linh vật mới nay có mặt khắp onboarding.
#
# ⚠️ Foreground của adaptive icon đã thu về 60% khung và đặt giữa. Mặt nạ tròn
# của Android chỉ chừa ~66% chiều rộng; dán ảnh vuông thẳng vào là mất tai và
# cằm con cáo — chỗ hỏng phổ biến nhất của icon Android.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FE9307"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

# Native splash — nền cam cùng icon (WTM-366). Splash gốc chỉ là khoảnh khắc
# trước khi Flutter dựng frame đầu; màn khởi động thật là WTM-367.
flutter_native_splash:
  color: "#FE9307"
  color_dark: "#FE9307"
  image: "assets/branding/app_icon_foreground.png"
  image_dark: "assets/branding/app_icon_foreground.png"
  android_12:
    color: "#FE9307"
    color_dark: "#FE9307"
    image: "assets/branding/app_icon_foreground.png"
    image_dark: "assets/branding/app_icon_foreground.png"
