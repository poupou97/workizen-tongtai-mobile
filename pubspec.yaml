name: tongtai
description: "Tổng Tài — AI-First Business OS for SME entrepreneurs (Workizen)."
publish_to: 'none'
version: 0.1.0+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / DI (ADR-TON-002: Riverpod is the single DI framework)
  flutter_riverpod: ^3.3.2

  # `@immutable` cho code KHÔNG được import Flutter.
  #
  # Bình thường annotation này đến kèm `flutter/foundation`, nhưng seam Durable
  # Agent (WTM-301) có hợp đồng "không phụ thuộc vòng đời mobile" — nó phải
  # chạy được trên Managed Worker/Oracle VM. Nên nó khai `meta` tường minh
  # thay vì mượn qua Flutter.
  meta: ^1.19.0

  # Local-first storage (SQLite + Drift)
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Security (BYOK keys live only in secure storage)
  flutter_secure_storage: ^10.3.1
  # Passphrase-encrypted backups (WTM-100, Founder-approved dependency):
  # pure-Dart AES-GCM + PBKDF2 — no platform channels.
  cryptography: ^2.7.0

  # AI client (xAI Grok BYOK, WTM-61)
  http: ^1.6.0

  # Product features
  uuid: ^4.5.3
  image_picker: ^1.2.2
  flutter_markdown: ^0.7.7

  cupertino_icons: ^1.0.8
  share_plus: ^13.2.1

  # In-app mascot rendering — Origami Business Fox as runtime vector (WTM-111)
  flutter_svg: ^2.0.17
  mobile_scanner: ^7.4.0
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  crypto: ^3.0.7
  file_selector: ^1.1.0
  archive: ^4.0.9
  xml: ^7.0.1

dev_dependencies:
  # `package:test` thuần, KHÔNG qua flutter_test.
  #
  # Cần cho `agent_task_pure_dart_test.dart` — bằng chứng cho điều kiện D-4
  # (WTM-301): logic nhận việc chạy được khi KHÔNG có Flutter binding nào tồn
  # tại, nên nó chạy được trên Managed Worker/Oracle VM. Một test dùng
  # `flutter_test` tự dựng binding nên không chứng minh được điều đó.
  test: ^1.26.2

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

  # Brand assets — generate native launcher icon + splash from the Origami
  # Business Fox (WTM-110, ADR mascot = Business Fox / Origami). Dev-only:
  # run `dart run flutter_launcher_icons` and
  # `dart run flutter_native_splash:create` to regenerate.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    # WTM-417 — bộ linh vật Ai CRM, cắt từ tờ art Founder giao bằng
    # `tool/cut_mascot_set.py`. Bộ origami cũ (`assets/mascot/poses/`) KHÔNG
    # còn khai ở đây: 25 PNG không ai dùng thì không có lý do đi vào APK. Tệp
    # vẫn nằm trong repo, gỡ khai báo là việc đảo ngược được.
    - assets/mascot/brand/
    # Bộ dữ liệu thương mại demo (WTM-325). Đóng gói vào app để Founder nhập
    # được ngay cả khi chưa nối Google Drive — cùng file, cùng đường import.
    - assets/demo/
    # WTM-414 — ảnh bộ demo, bundle để chạy offline và cùng SKU luôn ra cùng ảnh.
    - assets/demo/products/
    # WTM-416 — asset màn khởi động. KHÔNG bundle `assets/branding/`: những tệp
    # ấy chỉ để generator sinh icon native, đưa vào APK là 5 ảnh 1024px chết.
    - assets/startup/

# App launcher icon — WTM-416. Thay bộ cáo-mặc-vest-trên-nền-tối của WTM-366.
#
# ⛔ KHÔNG sửa tay bốn tệp trong `assets/branding/`. Chúng được SINH RA bởi
# `tool/build_brand_assets.py` từ tệp gốc Founder giao (`assets/new-icon/`), vì
# một logo phải ra bốn tệp ở bốn tỉ lệ khác nhau và tỉ lệ là chỗ luôn bị nhớ
# sai. Đổi logo ⇒ thay tệp gốc rồi chạy lại script.
#
# ⚠️ Vùng an toàn của adaptive icon là **58% khung, KHÔNG phải 66%**. Khung
# 108dp · nhìn thấy 72dp · an toàn 66dp — và 66dp trên khung 108dp là **61%**.
# Ghi chú trước ở đây chép thẳng số 66 từ dp sang phần trăm; dựng thử đúng 66%
# thì mặt nạ tròn cắt cụt chấm chữ "i". Lý lẽ đầy đủ nằm trong script.
#
# ⚠️ Nền adaptive nay là **ẢNH chuyển sắc**, không phải một mã màu: bộ nhận
# diện mới có nền trắng → tím/hồng nhạt, mà một màu phẳng thì hoặc mất chuyển
# sắc, hoặc để lộ đường ghép ở mép logo.
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

# Native splash — chỉ là khoảnh khắc trước khi Flutter dựng frame đầu; màn khởi
# động THẬT (logo + linh vật + dòng trạng thái) là màn Flutter, WTM-416 B.
#
# ⚠️ Splash dùng tệp RIÊNG, không dùng lại foreground của launcher: launcher bị
# generator inset 16% còn splash Android 12 bị mặt nạ tròn 66,7% — một tệp
# không vừa cả hai. Chi tiết trong `tool/build_brand_assets.py`.
#
# ⚠️ `image_dark` là một tệp KHÁC, không phải cùng một tệp. Chữ "CRM" trong logo
# màu navy (1,22,61): đặt lên nền tối thì chữ biến mất và người dùng thấy một
# logo cụt. Bản tối đổi riêng chữ ấy sang trắng.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0D1126"
  image: "assets/branding/app_splash_logo.png"
  image_dark: "assets/branding/app_splash_logo_dark.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0D1126"
    image: "assets/branding/app_splash_logo.png"
    image_dark: "assets/branding/app_splash_logo_dark.png"
