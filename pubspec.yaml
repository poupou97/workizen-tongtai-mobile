name: tongtai
description: "Tổng Tài — AI-First Business OS for SME entrepreneurs (Workizen)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / DI (ADR-TON-002: Riverpod is the single DI framework)
  flutter_riverpod: ^3.3.2

  # Local-first storage (SQLite + Drift)
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Security (BYOK keys live only in secure storage)
  flutter_secure_storage: ^10.3.1

  # AI client (xAI Grok BYOK, WTM-61)
  http: ^1.6.0

  # Product features
  uuid: ^4.5.3
  image_picker: ^1.2.2
  flutter_markdown: ^0.7.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
